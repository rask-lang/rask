# SPDX-License-Identifier: (MIT OR Apache-2.0)

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Two concurrent jobs, split so they finish at about the same time:
#
#   gates      — everything that needs the rask binary (~3m25 warm)
#   rust-tests — cargo test, which needs no rask binary of its own (~1m50 warm)
#
# Warm is the number that matters: a cold cache adds ~1m20 to the compiler
# build and ~1m25 to cargo test. Measured on run 31270117921.
#
# gates is now the critical path. What's left in it is Rust compilation
# (~1m) and the differential harness (~1m10); everything else is under 15s.
#
# The old single job ran cargo test *after* a `cargo build -p rask-cli` it never
# needed, so ~2m30 of Rust compilation sat behind ~1m of unrelated work.
#
# Measured before changing anything (run 31259380257, 10m15s total): the
# differential harness and cargo test were 29% and 25%, and a third step — a
# `continue-on-error` re-run of the suite the differential harness already
# subsumes — was another 28% that could never fail the build. That one is gone.
#
# cargo test is compile-bound, not run-bound: 2m52 to build the test binaries
# vs 40s to run them, both already saturating cores. So a faster test runner
# (nextest) would only touch the 40s — not worth the dependency.
#
# Within a job every gate keeps its `!cancelled()` guard, so one failing gate
# never masks the others and each run still reports the full matrix.

jobs:
  gates:
    name: gates (needs the rask binary)
    runs-on: ubuntu-latest
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-gates-${{ hashFiles('**/Cargo.lock') }}
        # Falls back to this job's last cache, then to the pre-split key. Without
        # that second line, renaming the key costs one fully cold run per branch
        # — 2m24 to build the compiler instead of ~1m, and 3m56 for cargo test.
        restore-keys: |
          ${{ runner.os }}-cargo-gates-
          ${{ runner.os }}-cargo-test-

    # Build steps are hard prerequisites: if either fails, the gates below are
    # skipped (nothing can run without the binary).
    - name: Build C runtime
      id: runtime
      run: make -C compiler/runtime

    - name: Build compiler (release)
      id: compiler
      run: cargo build --release -p rask-cli
      working-directory: compiler

    # Differential backend harness — every tests/suite/ file on BOTH backends,
    # fails on any UNTRACKED interp/native divergence. Tracked bugs/pending
    # features live in tests/known_divergences.txt + tests/pending_features.txt.
    # This is the native-execution gate; it subsumes a bare `rask test
    # tests/suite/` and additionally checks parity.
    #
    # Fans out across cores (DIFF_JOBS, default nproc): 3m35 -> 52s locally,
    # with byte-identical output and exit code to the serial version.
    - name: Differential harness (interp vs native)
      if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.compiler.outcome == 'success' }}
      run: tests/differential.sh

    # Example run-gate — every example with a tests/golden/ output must match on
    # both backends. Catches native codegen rot in examples/. Also parallel
    # (GATE_JOBS): 45s -> 16s locally.
    - name: Example run-gate
      if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.compiler.outcome == 'success' }}
      run: tests/examples_gate.sh

    # Memory leak gate. Every heap string in the language leaked for as long
    # as the compiler had strings (#1024) and nothing went red — a leak has no
    # symptom, the answers are all correct and there's just no memory coming
    # back. This runs the suite with the runtime counting what it allocated and
    # never gave back; a clean program ends at exactly zero.
    - name: Memory leak gate
      if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.compiler.outcome == 'success' }}
      run: tests/leak_gate.sh

    # Internal-spelling gate. MIR mints names for operations the stdlib
    # declares under another spelling, and `INTERNAL_SPELLINGS` says what each
    # stands for — that is what decides who owns what crosses the call. A name
    # with no line there is treated as owning everything it touches, which
    # leaks rather than double-frees; this is what stops it staying that way.
    # Runs the suite through `rask test` as well as `compile`, because the two
    # lowering paths reach different names.
    - name: Internal spelling gate
      if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.compiler.outcome == 'success' }}
      run: tests/spellings_gate.sh

    # The design prototypes, on both backends. differential.sh only scans
    # tests/suite/, and these are main-only so `rask test` runs nothing on them
    # and exits 0 — so the programs written to show Rack/Link working end to end
    # had no parity coverage at all. That is how #984 left the linked list
    # printing nothing on native, and how #866 hid in the scene tree.
    - name: Prototype backend parity
      if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.compiler.outcome == 'success' }}
      run: tests/prototypes_gate.sh

    # The agent benchmark's reference solutions, as a differential test over
    # nineteen more ordinary programs. Calls no model and spends nothing — the
    # paid adapters aren't reachable from the gate. A reference that goes red
    # means the task is measuring the compiler instead of the model, so the
    # scores stop meaning anything until it is fixed or quarantined against an
    # issue; #1000 and #1002 were both caught that way. The harness's own
    # end-to-end check is deliberately not here: CI shouldn't depend on
    # benchmark plumbing, so that one is run by hand.
    - name: Agent benchmark reference gate
      if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.compiler.outcome == 'success' }}
      run: tests/agentbench_gate.sh

    # projects/*/ type-checks. Nothing checked them, which is how raido reached
    # 48 errors and tiwaz 11 (#774) — every rule change since they were written
    # landed without anything noticing. `check` only: neither runs natively yet.
    - name: Projects check
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/projects_gate.sh

    # The multi-file validation program. Nothing built it before, which is how
    # a package-wide `catch` migration (#607) and the span mis-attribution
    # (#621) both shipped — every other gate runs single files.
    - name: Flagship package builds
      if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.compiler.outcome == 'success' }}
      run: ./compiler/target/release/rask build examples/validation --release

    # The formatter's output has to still be the same program. Nothing compared
    # the two, which is how `rask fmt` came to drop `as` bindings, `using`
    # clauses, enum and trait attributes and every parenthesis that mattered —
    # 21 of 30 examples stopped compiling after being formatted (#805).
    - name: Formatter round-trip
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/fmt_roundtrip_gate.sh

    # Parse-only spec conformance (existing weak signal — snippets parse).
    - name: Spec snippets parse
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: ./compiler/target/release/rask test-specs specs/

    # Same gate for the published docs. specs/ was covered and docs/ wasn't,
    # which is how the book and landing page drifted a release behind.
    - name: Docs snippets parse
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: ./compiler/target/release/rask test-specs docs/ README.md

    # The playground's wasm build. Nothing here compiled for wasm32, so a
    # cfg-gated stdlib module could lose its callers' guards and only break in
    # the deploy workflow — which is how docs deploys stayed red for 30
    # consecutive runs (#622). `check` not `build`: enough to catch it, cheap.
    - name: Wasm target builds
      if: ${{ !cancelled() }}
      run: cargo check -p rask-wasm --target wasm32-unknown-unknown
      working-directory: compiler

  rust-tests:
    name: rust-tests (cargo test)
    runs-on: ubuntu-latest
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # Separate key from the gates job so the two don't race to write the same
    # cache; restore-keys warms this one from its own last run, then from the
    # pre-split key so renaming doesn't cost a cold run on every new branch.
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-rust-tests-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-rust-tests-
          ${{ runner.os }}-cargo-test-

    # The native compile+run golden fixtures shell out to the C runtime.
    - name: Build C runtime
      run: make -C compiler/runtime

    # Rust integration + unit tests (fixtures, compile_errors wiring, native
    # compile+run golden fixtures). cargo builds whatever binaries the tests
    # need, so this job needs no separate `cargo build -p rask-cli`.
    #
    # Debug, not --release. These tests are compile-bound, and dropping
    # optimization cuts the build far more than it costs at run time:
    #
    #   --release   2m52 compile + 40s run
    #   debug       1m38 compile + 43s run
    #
    # Same 942 tests, both green — debug isn't skipping anything. The run
    # barely moves because the fixtures shell out to a rask binary from the
    # same profile but spend their time in process startup and linking, not
    # in optimized inner loops.
    #
    # The other half of the trade is the point: debug turns on integer
    # overflow checks and `debug_assert!`. Nothing fires today, so this costs
    # no red CI now and catches the next arithmetic bug for free.
    #
    # What dropping --release here does NOT give up, checked rather than
    # assumed:
    #   - Rask's generated code is identical either way. Cranelift is pinned to
    #     opt_level "speed" unconditionally (codegen/module.rs:56,95), not
    #     derived from how rask itself was built, so the codegen tests assert
    #     the same machine code in both profiles.
    #   - Profile-divergent Rust: one `cfg!(debug_assertions)` in the whole
    #     tree (codegen/dispatch.rs) and it's a debug-ONLY duplicate-key
    #     diagnostic — debug is the stricter side of that branch, not the
    #     weaker one.
    #   - Optimization-exposed UB: two `unsafe` sites in the tree, both signal
    #     and fd handling in interp/stdlib/os.rs, which these tests don't
    #     reach in either profile.
    #   - Timing flakes: no sleeps, timeouts or duration assertions in tests.
    #
    # And the release build is still exercised hard every run — the gates job
    # builds rask with --release and pushes ~360 program compilations through
    # it (differential 158x2, examples 20x2, plus snippets and the flagship
    # package). What's left uncovered is a rustc miscompile of safe Rust,
    # which isn't worth ~3m30 on every run to chase.
    - name: cargo test
      run: cargo test
      working-directory: compiler
