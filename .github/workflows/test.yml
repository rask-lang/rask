# SPDX-License-Identifier: (MIT OR Apache-2.0)

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Eight jobs that all start at once, on nine runners — gates-memcheck is a
# two-way matrix. Six of them run the gates that need a rask binary, one runs
# cargo test, one builds and runs on Darwin.
#
# The shape is "everything in parallel, nothing waits". No job needs another, so
# the run takes as long as its slowest job and no longer. Each gate job builds
# its own rask — four builds instead of one, which is pure waste in CPU and
# free in wall-clock, and Actions minutes cost nothing on a public repo. Handing
# one build to the others as an artifact would be tidier and about 45s slower,
# because then every gate waits for that build to finish before it starts.
#
# How the gates are split: the differential harness can't be cut, so it gets a
# job to itself and the cheap gates are packed to match it. The matrix is the
# other one that can't be packed — it compiles 267 generated programs natively
# — so it has a job too. If one grows past ~2m, move something out of it rather
# than letting the whole run stretch.
#
# That last rule went unenforced and gates-memory reached 4m24 while every other
# job finished inside 3m15 — one job setting the pace for the whole run. It was
# valgrind: 159s of those 261s, against 48s for the leak gate and 7s for the
# tutorials. So memcheck moved to gates-memcheck, in two shards, and the three
# cheap gates stayed behind. Read the rule as load-bearing, not advisory.
#
# Split them further whenever it helps — but leave the `gates` job alone. It is
# the name branch protection requires, and the only one here that has to stay
# put; see the comment on it.
#
# How this got from 12m29 to where it is:
#
#   12m29  one gates job running its gates one at a time, on one core each
#    8m00  the slow gates learned to use all four cores (tests/lib/fanout.sh)
#    5m13  four gate jobs at once, and cargo test back on --release
#    3m03  sccache, so an unchanged crate stops being rebuilt every run
#
# Three different causes, and none of them was "the tests are slow":
#
#   gates       8m00 = 1m21 building rask + 5m46 of gates, one after another
#   rust-tests  4m20 =   31s compiling   + 3m17 running, 3m12 of it in ONE
#                                          test binary, compile_run.rs
#
# sccache is here for the third one. Cargo decides a crate is dirty by comparing
# source mtimes, and actions/cache restores compiler/target/ with its old mtimes
# while the checkout stamps every .rs file with "now" — so every run rebuilt all
# 23 workspace crates whether or not any Rust had changed. Commit 31d234c
# changed a single comment in this file and still paid 1m01 for it. sccache keys
# on content instead, so an unchanged crate is a hit no matter what its mtime
# says: the build went from 1m25 to 22-33s across the four gate jobs. The cargo
# cache stays for the dependency builds and the linked artifacts, which sccache
# doesn't cover.
#
# A cold sccache costs about 30s extra and looks like a regression. Judge a
# change here on the run after it, not the run that carries it.
#
# Every gate keeps its `!cancelled()` guard, so one failing gate never masks the
# others in the same job and each run still reports the full matrix.
#
# None of the gate jobs run `make -C compiler/runtime`. Nothing needs it: the
# rask binary carries the runtime sources baked in and the linker compiles them
# itself into its own cache (~2.7s, once per job). `make` builds
# librask_runtime.a, which nothing links — so it survives as one explicit
# "the runtime still builds with gcc" step next to the clang one.

jobs:
  # ── The differential harness, alone. It's the longest single gate (~1m30) and
  # the other three jobs are sized against it.
  gates-suite:
    name: gates-suite (both backends, every suite file)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Compiler cache (sccache)
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-gates-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-gates-
    - name: Build compiler (release)
      id: compiler
      run: cargo build --release -p rask-cli
      working-directory: compiler

    # Every tests/suite/ file on BOTH backends, failing on any UNTRACKED
    # interp/native divergence. Tracked bugs and pending features live in
    # tests/known_divergences.txt + tests/pending_features.txt. This is the
    # native-execution gate; it subsumes a bare `rask test tests/suite/` and
    # additionally checks parity. Fans out across cores (tests/lib/fanout.sh;
    # DIFF_JOBS overrides the default of one job per core).
    - name: Differential harness (interp vs native)
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/differential.sh

  # ── The type x carrier matrix, alone. It builds and runs 267 small programs
  # on both backends, so it is the second long pole (~4m) and doesn't fit in a
  # packed job.
  gates-matrix:
    name: gates-matrix (payload x carrier, both backends)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Compiler cache (sccache)
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-gates-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-gates-

    - name: Build compiler (release)
      id: compiler
      run: cargo build --release -p rask-cli
      working-directory: compiler

    # One program per (payload type, carrier) pair, on both backends. The
    # differential harness only sees the files somebody wrote; this generates
    # the cross-product, so "an f32 breaks in a Heap but not in a Vec" turns up
    # without anyone guessing to write that file. Expected-red cells live in
    # tests/matrix/known_red.txt and pairs that aren't legal Rask in gen.py's
    # SKIPS. Fans out across cores (tests/lib/fanout.sh).
    - name: Type x carrier matrix
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/matrix/run.sh

  # ── What the runtime hands back, and what a learner reads.
  gates-memory:
    name: gates-memory (leaks, tutorials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Compiler cache (sccache)
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-gates-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-gates-
    - name: Build compiler (release)
      id: compiler
      run: cargo build --release -p rask-cli
      working-directory: compiler

    # Every heap string in the language leaked for as long as the compiler had
    # strings (#1024) and nothing went red — a leak has no symptom, the answers
    # are all correct and there's just no memory coming back. This runs the
    # suite with the runtime counting what it allocated and never gave back; a
    # clean program ends at exactly zero. Parallel (LEAK_JOBS): 2m42 -> 1m07.
    - name: Memory leak gate
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/leak_gate.sh

    # The tutorial answer key. `tutorials/learn-rask/solutions/` was referenced
    # by nothing at all, and seven of nineteen solutions didn't compile (#1030)
    # — they'd been broken for a while, since the same seven fail on the commit
    # before the string-API change that surfaced them. These are what a learner
    # reads when they're stuck, so a wrong one costs more than a missing one.
    - name: Tutorial solutions
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/tutorials_gate.sh

  # ── valgrind, on its own runners.
  #
  # The leak gate measures one direction of "who frees this": memory nobody gave
  # back. The other direction — giving it back too early, reading a field nobody
  # wrote — had no instrument at all, and everything found in it so far was
  # found by a crash. Within a minute of first being pointed at the suite this
  # found a struct built field by field that had grown two fields nobody
  # initialised, which the leak gate, twelve other gates and a 30x
  # poisoned-stack run all called green.
  #
  # Why it is a job of its own, in two shards: it was 159s of the 261s
  # gates-memory job, which made that job the long pole of the whole workflow at
  # 4m24 — everything else finishes inside 3m15. valgrind is a ~30x slowdown and
  # the gate already fans out across every core, so the only lever left is more
  # machines. Two shards of ~273 files each, and gates-memory drops to the pack.
  #
  # Raise `shard` to three if the suite grows enough to push a leg past ~2m30;
  # the gate reads the count from the matrix, so that is the only edit needed.
  gates-memcheck:
    name: gates-memcheck (valgrind, shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Compiler cache (sccache)
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-gates-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-gates-
    - name: Build compiler (release)
      id: compiler
      run: cargo build --release -p rask-cli
      working-directory: compiler

    - name: Install valgrind
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: sudo apt-get update && sudo apt-get install -y valgrind

    - name: Memory error gate (valgrind)
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      env:
        MEMCHECK_SHARDS: ${{ strategy.job-total }}
        MEMCHECK_SHARD: ${{ matrix.shard }}
      run: tests/memcheck_gate.sh

  # ── Who owns what crosses a call, and whether the programs we show people
  # still produce the output we claim.
  gates-names:
    name: gates-names (spellings, examples, prototypes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Compiler cache (sccache)
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-gates-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-gates-
    - name: Build compiler (release)
      id: compiler
      run: cargo build --release -p rask-cli
      working-directory: compiler

    # MIR mints names for operations the stdlib declares under another spelling,
    # and `INTERNAL_SPELLINGS` says what each stands for — that is what decides
    # who owns what crosses the call. A name with no line there is treated as
    # owning everything it touches, which leaks rather than double-frees; this
    # is what stops it staying that way. Runs the suite through `rask test` as
    # well as `compile`, because the two lowering paths reach different names.
    # Parallel too (SPELL_JOBS): 3m13 -> 1m16.
    - name: Internal spelling gate
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/spellings_gate.sh

    # A rule id is a name: CONVENTIONS.md cites rules as `spec-id/RULE` and
    # diagnostics print them (`warning[comp.effects/CW2]`). Two rules sharing
    # one id makes every citation of it ambiguous, and it happens by accident
    # because a file with two rule tables numbers each from its own end. Needs
    # no compiler, so it runs whatever else broke.
    - name: Spec reference gate
      if: ${{ !cancelled() }}
      run: tests/spec_refs_gate.py

    # `rask lint` on the code a reader is meant to copy. It ran from an editor
    # hook and nowhere else, so its findings piled up unread — 3 errors and 24
    # warnings by the time anyone counted.
    - name: Lint gate
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/lint_gate.sh

    # Every example with a tests/golden/ output must match on both backends.
    # Catches native codegen rot in examples/. Also parallel (GATE_JOBS).
    - name: Example run-gate
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/examples_gate.sh

    # The suite's spawning files against the runtime set macOS links — no
    # green scheduler, tasks on OS threads. On an ubuntu runner, because that
    # configuration was never built anywhere but a Mac: `spawn` failed to link
    # there for two releases and a person compiling on their own machine is
    # what found it (#1180).
    - name: No-green gate (the source set macOS links)
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/no_green_gate.sh

    # The design prototypes, on both backends. differential.sh only scans
    # tests/suite/, and these are main-only so `rask test` runs nothing on them
    # and exits 0 — so the programs written to show Rack/Link working end to end
    # had no parity coverage at all. That is how #984 left the linked list
    # printing nothing on native, and how #866 hid in the scene tree.
    - name: Prototype backend parity
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/prototypes_gate.sh

    # The agent benchmark's reference solutions, as a differential test over
    # nineteen more ordinary programs. Calls no model and spends nothing — the
    # paid adapters aren't reachable from the gate. A reference that goes red
    # means the task is measuring the compiler instead of the model, so the
    # scores stop meaning anything until it is fixed or quarantined against an
    # issue; #1000 and #1002 were both caught that way. The harness's own
    # end-to-end check is deliberately not here: CI shouldn't depend on
    # benchmark plumbing, so that one is run by hand.
    - name: Agent benchmark reference gate
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/agentbench_gate.sh

  # ── Everything that is about the surface we publish: formatting, packages,
  # prose, and the C the runtime is written in.
  gates-surface:
    name: gates-surface (fmt, packages, docs, runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Compiler cache (sccache)
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-gates-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-gates-
    - name: Build compiler (release)
      id: compiler
      run: cargo build --release -p rask-cli
      working-directory: compiler

    # The formatter's output has to still be the same program. Nothing compared
    # the two, which is how `rask fmt` came to drop `as` bindings, `using`
    # clauses, enum and trait attributes and every parenthesis that mattered —
    # 21 of 30 examples stopped compiling after being formatted (#805). Parallel
    # as well (FMT_JOBS): 1m32 -> 41s.
    - name: Formatter round-trip
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/fmt_roundtrip_gate.sh

    # The multi-file validation program. Nothing built it before, which is how
    # a package-wide `catch` migration (#607) and the span mis-attribution
    # (#621) both shipped — every other gate runs single files.
    - name: Flagship package builds
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: ./compiler/target/release/rask build examples/validation --release

    # A build that crosses a package boundary. Every package in the repo was a
    # self-contained root — nothing declared a dependency — so `dep "x" { path }`
    # had no coverage at all, and #1112 sat in the tree: a library exporting a
    # function that constructs its own struct breaks every consumer, called or
    # not.
    - name: Multi-package builds
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/packages_gate.sh

    # projects/*/ type-checks. Nothing checked them, which is how raido reached
    # 48 errors and tiwaz 11 (#774) — every rule change since they were written
    # landed without anything noticing. `check` only: neither runs natively yet.
    - name: Projects check
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/projects_gate.sh

    # The flagship HTTP server, driven over a real socket on both backends. It
    # never exits, so the examples gate can't diff its stdout — and this harness
    # ran in no job at all, which is how the native server came to answer every
    # request with eight bytes of allocator free-list where `HTTP/1.1` should
    # be. A string cast to an address was released at the cast, so the buffer
    # was freed before the write read it.
    - name: HTTP server harness (both backends)
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/http_api_harness.sh

    # The book, against the compiler. "Docs snippets parse" below already runs
    # the book's inline blocks, but parsing is a weak signal: the front-page
    # snippet parsed fine while calling an API the real grep program doesn't
    # use, with both imports missing. This gate adds what parsing can't see:
    # every block must be an {{#include}} from a program another gate runs or
    # carry a compile/run marker; every include must resolve; and the compile
    # errors a chapter teaches with are pinned renderings of `rask check`, so
    # improving a diagnostic shows up as a diff on the page that teaches it.
    - name: Book gate
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/book_gate.sh

    # Parse-only spec conformance (existing weak signal — snippets parse).
    - name: Spec snippets parse
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: ./compiler/target/release/rask test-specs specs/

    # Same gate for the published docs, and for the language card. specs/ was
    # covered and docs/ wasn't, which is how the book and landing page drifted
    # a release behind; LANGUAGE_CARD.md sits at the repo root and was in
    # neither, which is worse — it's the reference that travels with a prompt
    # when a model writes Rask, and agentbench's system prompt (#1014). Its
    # blocks carry `<!-- test: parse -->` now; without an annotation
    # `test-specs` reads a file and finds nothing, so the step would have
    # passed on a card full of nonsense.
    - name: Docs snippets parse
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: ./compiler/target/release/rask test-specs docs/ writing/ README.md LANGUAGE_CARD.md

    # The runtime through gcc. Nothing links librask_runtime.a, so this exists
    # only to say the runtime still builds the ordinary way — the linker's own
    # copy is compiled per-object and would hide a Makefile that rotted.
    - name: Runtime builds with gcc
      if: ${{ !cancelled() }}
      run: make -C compiler/runtime

    # The runtime through clang. gcc builds it above and clang builds it on the
    # macOS job, so a gcc/clang difference could only surface there — and that
    # job can't build green.c or the two I/O engines at all, since they need
    # Linux headers. Those three had no clang coverage anywhere, which is how
    # a `_Atomic` variable touched with gcc's `__atomic_*` builtins (fine to
    # gcc, rejected by clang) sat in string.c. Compiles only, ~10s, no macOS
    # runner.
    - name: Runtime builds with clang
      if: ${{ !cancelled() }}
      run: tests/clang_gate.sh

    # The playground's wasm build. Nothing here compiled for wasm32, so a
    # cfg-gated stdlib module could lose its callers' guards and only break in
    # the deploy workflow — which is how docs deploys stayed red for 30
    # consecutive runs (#622). `check` not `build`: enough to catch it, cheap.
    - name: Wasm target builds
      if: ${{ !cancelled() }}
      run: cargo check -p rask-wasm --target wasm32-unknown-unknown
      working-directory: compiler

  # Branch protection on main requires a check with this exact name. It used to
  # be the one big gates job; splitting that into four renamed it out of
  # existence, so the required check had nothing reporting it and every PR sat
  # "waiting for status to be reported" with six green jobs above it.
  #
  # So this is the name branch protection points at from now on, and it is the
  # one thing here that has to stay stable: the gates behind it can be split,
  # merged or renamed freely without anyone touching repository settings. It
  # runs nothing itself — it passes when every gate job passed.
  #
  # `needs:` alone would not do it. A needed job that fails normally skips this
  # one, and a skipped required check never reports — the same stuck-pending
  # state it exists to prevent. `always()` makes it run whatever happened, and
  # the step reads the results itself.
  gates:
    name: gates (needs the rask binary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [gates-suite, gates-matrix, gates-memory, gates-memcheck, gates-names, gates-surface]
    steps:
    - name: Every gate passed
      env:
        RESULTS: >-
          gates-suite=${{ needs.gates-suite.result }}
          gates-matrix=${{ needs.gates-matrix.result }}
          gates-memory=${{ needs.gates-memory.result }}
          gates-memcheck=${{ needs.gates-memcheck.result }}
          gates-names=${{ needs.gates-names.result }}
          gates-surface=${{ needs.gates-surface.result }}
      run: |
        echo "$RESULTS"
        failed=0
        for pair in $RESULTS; do
          case "${pair#*=}" in
            success) ;;
            *) echo "::error::${pair%%=*} did not pass (${pair#*=})"; failed=1 ;;
          esac
        done
        exit "$failed"

  rust-tests:
    name: rust-tests (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Compiler cache (sccache)
      uses: mozilla-actions/sccache-action@v0.0.11

    # Separate key from the gate jobs so the two don't race to write the same
    # cache. The gate jobs share one key between them, which is fine — whoever
    # finishes first writes it and the rest find it already there.
    #
    # `-release-` is in the key because the profile decides what lands in
    # compiler/target/, and actions/cache never overwrites a key that already
    # exists. This job used to build debug, so the old key holds debug
    # artifacts: asking for it back after the switch handed cargo a target dir
    # with nothing in it cargo could use, and then refused to save the release
    # build it did instead. Every run started cold — 5m11 of it, for as long as
    # Cargo.lock stayed put. Anything that changes what goes in that directory
    # has to change this key with it.
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-rust-tests-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-rust-tests-release-

    # Rust integration + unit tests (fixtures, compile_errors wiring, native
    # compile+run golden fixtures).
    #
    # --release, and the reason is `compile_run.rs`. It has 379 tests that each
    # shell out to the rask binary cargo just built, compile a .rk fixture, link
    # it and run it. So every one of them pays for however fast that binary is,
    # and an unoptimized rask is slow: the same 20 fixtures take 37.6s through
    # `target/debug/rask` and 6.3s through `target/release/rask`. Six times.
    #
    # On run 34747869130 that one test binary was 192s of the job's 197s of
    # running, against 31s of compiling. Trading ~1m of extra compile for ~2m30
    # of that is the right way round.
    #
    # It used not to be. When this job was put on debug the trade was measured
    # as 2m52 compile + 40s run against 1m38 + 43s, and debug won easily.
    # compile_run.rs has roughly quadrupled since, and it is now the job. If it
    # ever stops being the job, measure again rather than trusting this note.
    #
    # What --release costs, beyond compile time: debug turns on integer overflow
    # checks and `debug_assert!`, and those are real. They still run — every
    # other test binary in the workspace is unaffected by how fast rask is, so
    # if the arithmetic checks matter more than the wall clock the answer is to
    # split this job, not to put the whole thing back on debug.
    #
    # What it does NOT cost, checked rather than assumed: Rask's generated code
    # is identical either way. Cranelift is pinned to opt_level "speed"
    # unconditionally (codegen/module.rs:56,95), not derived from how rask
    # itself was built, so the codegen tests assert the same machine code in
    # both profiles.
    - name: cargo test
      run: cargo test --release
      working-directory: compiler

  # Darwin. Everything above runs on Linux, and the release ships a macOS
  # binary — so for two releases running, the first time anyone compiled this
  # code with Apple's headers was release day. Both breaks were the same kind:
  # glibc hands out a non-POSIX name anyway, Darwin doesn't, and the Makefile
  # asks for strict POSIX. A green Linux run says nothing about either. And the
  # release job is `needs: build`, so a macOS failure means no release at all —
  # the Linux binary doesn't get published either (#1170).
  #
  # Three things, in the order a break would hit them:
  #
  #   1. `make -C compiler/runtime` — the 26 sources macOS actually links (the
  #      Makefile drops the three Linux-only ones), which is where both release
  #      day failures were.
  #   2. `cargo build --release -p rask-cli` — what the release job builds. A
  #      Rust-side `#[cfg(target_os)]` break lands here.
  #   3. A program compiled and run. This is the only step that exercises ld64,
  #      and ld64 is the one thing a Linux runner cannot stand in for: it
  #      rejected every Rask object for two releases because DWARF carried ELF
  #      section names (#1184), and `ld64.lld` on Linux accepts that object
  #      happily, so nothing here could catch it.
  #
  # Narrow on purpose at step 3: hello-world, three suite files covering
  # collections, strings and enums, and the spawning files — `spawn` is backed
  # by OS threads off Linux now (#1180), and this is the only place the real
  # thing runs on Darwin rather than through the Linux stand-in. Not the full
  # gates: macOS runners bill at 10x.
  macos-build:
    name: macos-build (runtime, compiler and a linked program on Darwin)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RASK_RUNTIME_DIR: ${{ github.workspace }}/compiler/runtime
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Compiler cache (sccache)
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-macos-

    - name: Build C runtime
      run: make -C compiler/runtime

    - name: Build compiler (release)
      id: compiler
      if: ${{ !cancelled() }}
      run: cargo build --release -p rask-cli
      working-directory: compiler

    # Compiles, links through ld64, and runs. A debug build, so the object
    # carries DWARF — which is the half ld64 refused (#1184).
    - name: Compile and run a program
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: |
        set -eu
        printf 'func main() {\n    println("hello from darwin")\n}\n' > /tmp/hello.rk
        out=$(compiler/target/release/rask run /tmp/hello.rk)
        test "$out" = "hello from darwin" || { echo "got: $out"; exit 1; }

    # Linking was never the finish line for #1184. ld64 doesn't copy DWARF into
    # the executable — it writes a debug map pointing back at the object files,
    # and `rask` deletes its object as soon as the link returns, so a binary
    # that links can still show a debugger nothing. `dsymutil` runs at the end
    # of a Mach-O link now, and this checks the bundle it produces actually
    # carries the program's source file and its line table.
    - name: Debug info survives the link
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: |
        set -eu
        printf 'func main() {\n    println("dwarf")\n}\n' > /tmp/dwarf.rk
        compiler/target/release/rask compile /tmp/dwarf.rk -o /tmp/dwarfbin
        test -d /tmp/dwarfbin.dSYM || { echo "no .dSYM next to the binary"; exit 1; }
        dwarfdump --debug-info /tmp/dwarfbin.dSYM > /tmp/dwarf-info.txt
        grep -q 'dwarf\.rk' /tmp/dwarf-info.txt || {
          echo "the .dSYM names no source file:"; cat /tmp/dwarf-info.txt; exit 1; }
        dwarfdump --debug-line /tmp/dwarfbin.dSYM > /tmp/dwarf-line.txt
        grep -q 'dwarf\.rk' /tmp/dwarf-line.txt || {
          echo "the .dSYM has no line table:"; cat /tmp/dwarf-line.txt; exit 1; }

    - name: Run suite files natively
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: |
        set -eu
        for f in tests/suite/t_week_collection_stubs.rk \
                 tests/suite/t_message_without_a_result.rk \
                 tests/suite/t_stdlib_default_argument.rk; do
          compiler/target/release/rask test "$f"
        done

    # Every suite file that spawns. Darwin has no green scheduler, so these run
    # on the thread-backed path — the same one the Linux no-green gate checks,
    # here on the platform it is for.
    - name: Spawning suite files
      if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
      run: tests/no_green_gate.sh
