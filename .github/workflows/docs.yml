name: Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/book/**'
      - 'docs/playground/**'
      - 'docs/landing/**'
      - 'docs/shared/**'
      - 'examples/**'
      - 'compiler/crates/rask-wasm/**'
      - 'compiler/crates/rask-interp/**'
      - 'compiler/crates/rask-lexer/**'
      - 'compiler/crates/rask-parser/**'
      - 'compiler/crates/rask-desugar/**'
      - 'compiler/crates/rask-diagnostics/**'
      - 'compiler/crates/rask-ast/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # the failure reporter below opens/updates an issue
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          compiler/target/
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

    - name: Install wasm-pack
      run: cargo install wasm-pack --locked || true

    - name: Build WASM Playground
      run: |
        cd compiler/crates/rask-wasm
        wasm-pack build --target web --out-dir ../../../docs/playground/pkg
        rm -f ../../../docs/playground/pkg/.gitignore

    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        mdbook-version: 'latest'

    - name: Build mdBook
      run: |
        # The palette is served from the site root and the book's theme
        # @imports it from there, so it has to be in place before mdbook runs.
        mkdir -p docs/build
        cp docs/shared/tokens.css docs/build/tokens.css
        cd docs/book
        mdbook build -d ../build/book

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build playground examples
      run: node docs/playground/build-examples.js

    - name: Add landing page and other content
      run: |
        # Copy landing page to root
        cp docs/landing/index.html docs/build/index.html
        cp docs/landing/landing.css docs/build/landing.css

        # Copy playground to /app/
        mkdir -p docs/build/app
        cp -r docs/playground/*.html docs/playground/*.js docs/playground/*.css docs/playground/*.png docs/build/app/
        cp -r docs/playground/pkg docs/build/app/

        # The blog became the book's Notes section; keep the old URL working.
        mkdir -p docs/build/blog
        cp docs/landing/blog-redirect.html docs/build/blog/index.html

        # Copy meta files
        cp docs/CNAME docs/build/CNAME
        cp docs/.nojekyll docs/build/.nojekyll

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        publish_branch: gh-pages
        enable_jekyll: false
        force_orphan: true

    # This workflow only runs on push to main, so its failures can't fail a PR —
    # which is how it stayed red for 30 consecutive runs without anyone noticing
    # (#622). Opening an issue costs nothing on a green run: the step is skipped.
    # It reuses one issue rather than filing a new one per failed push.
    - name: Report deploy failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'Docs deploy is failing'
          const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          const body = `Deploy failed on \`${context.sha.slice(0, 8)}\`.\n\n${url}\n\nThe site is serving whatever last deployed successfully until this is fixed.`
          const { data: found } = await github.rest.search.issuesAndPullRequests({
            q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
          })
          if (found.total_count > 0) {
            await github.rest.issues.createComment({
              ...context.repo, issue_number: found.items[0].number, body,
            })
          } else {
            await github.rest.issues.create({
              ...context.repo, title, body,
            })
          }
