[package]
name = "rask-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rask"
path = "src/main.rs"

[dependencies]
rask-ast = { path = "../rask-ast" }
rask-lexer = { path = "../rask-lexer" }
rask-parser = { path = "../rask-parser" }
rask-resolve = { path = "../rask-resolve" }
rask-desugar = { path = "../rask-desugar" }
rask-types = { path = "../rask-types" }
rask-check = { path = "../rask-check" }
rask-diagnostics = { path = "../rask-diagnostics" }
rask-interp = { path = "../rask-interp" }
rask-spec-test = { path = "../rask-spec-test" }
rask-fmt = { path = "../rask-fmt" }
rask-comptime = { path = "../rask-comptime" }
rask-describe = { path = "../rask-describe" }
rask-lint = { path = "../rask-lint" }
rask-mir = { path = "../rask-mir" }
rask-codegen = { path = "../rask-codegen" }
rask-stdlib = { path = "../rask-stdlib" }
rask-c-parse = { path = "../rask-c-parse" }
