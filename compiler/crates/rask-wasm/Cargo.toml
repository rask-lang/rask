[package]
name = "rask-wasm"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Rask compiler crates. The frontend comes from rask-compiler rather than being
# assembled here — one pipeline, so the playground can't drift from `rask run`.
rask-compiler = { path = "../rask-compiler" }
rask-interp = { path = "../rask-interp" }
rask-diagnostics = { path = "../rask-diagnostics" }
