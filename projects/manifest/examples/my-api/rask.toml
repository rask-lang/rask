# The full example from specs/structure/build.md, plus a git dependency.
schema = "rask-package@1"

[package]
name = "my-api"
version = "1.0.0"
description = "REST API server"
license = "MIT"

[dependencies]
http          = { registry = "^2.0", allow = ["net"] }
json          = { registry = "^1.5" }
epoll         = { registry = "^1.0", target = "linux" }
protobuf-rask = { registry = "^0.9", allow = ["build_exec"] }
tls           = { git = "https://github.com/example/tls", rev = "a1b2c3" }

[dev_dependencies]
mock-server = { registry = "^2.0" }

[features.ssl.dependencies]
openssl            = { registry = "^3.0", target = "linux", allow = ["ffi"] }
security-framework = { registry = "^2.0", target = "macos" }

[features.full]
enables = ["ssl", "logging"]

[profiles.staging]
inherits = "release"
debug_info = true
