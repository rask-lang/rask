[book]
title = "Learning Rask"
authors = ["Rask Contributors"]
description = "The Rask book: learn the language one concept at a time"
language = "en"
src = "src"

[build]
build-dir = "../build"
create-missing = false
# mdBook's `index` preprocessor renders each README.md as index.html but
# leaves links to it pointing at README.html, which doesn't exist. Without
# it a README stays README.html, and a link to README.md works on the site
# and in a clone alike. `links` is the other default, for {{#include}}.
use-default-preprocessors = false

[preprocessor.links]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/rask-lang/rask"
edit-url-template = "https://github.com/rask-lang/rask/edit/main/docs/book/{path}"
site-url = "/book/"
additional-css = ["theme/custom.css"]
additional-js = ["theme/chrome.js", "theme/run.js"]

[output.html.playground]
editable = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3